<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>terp</title>
    <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav id="sidebar" aria-label="作業とターミナルの一覧">
      <div class="sidebar__head">
        <span class="sidebar__title">作業</span>
        <button id="add-project" class="icon-btn" type="button" aria-label="リポジトリを追加" title="リポジトリを追加">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <path d="M12 11v5M9.5 13.5h5" />
          </svg>
        </button>
      </div>
      <div id="tree" class="tree">
        <div id="no-projects" class="tree__empty" hidden>
          <p>リポジトリを追加すると、作業（worktree）ごとにターミナルをまとめられます</p>
          <button id="empty-add-project" class="btn" type="button">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              <path d="M12 11v5M9.5 13.5h5" />
            </svg>
            <span>リポジトリを追加</span>
          </button>
        </div>
        <div id="projects"></div>
        <section id="loose" class="project" hidden>
          <div class="project__head">
            <span class="project__name">その他のターミナル</span>
          </div>
          <ul class="session-list"></ul>
        </section>
      </div>
      <p id="config-error" class="config-error" role="alert" hidden></p>
      <p id="host-notice" class="config-error" role="status" hidden>
        シェルを持つ常駐のプロセスが古い版のまま動いています。ターミナルをすべて閉じると、次に開いたときに新しい版に切り替わります。
      </p>
      <div class="sidebar__foot">
        <button id="new-work" class="btn btn--block-sm" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="6" cy="6" r="2" /><circle cx="6" cy="18" r="2" /><circle cx="18" cy="8" r="2" />
            <path d="M6 8v8M18 10c0 4-6 3-6 8" />
          </svg>
          <span>新しい作業</span>
          <kbd class="btn__key">⌘N</kbd>
        </button>
        <button id="new-terminal" class="btn btn--primary btn--block" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          <span>新しいターミナル</span>
          <kbd class="btn__key">⌘T</kbd>
        </button>
      </div>
    </nav>
    <main id="terminals">
      <div class="topbar">
        <button id="git-toggle" class="btn topbar__btn" type="button" aria-pressed="false" title="変更の一覧（⌘⇧G）">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="6" cy="6" r="2" /><circle cx="6" cy="18" r="2" /><circle cx="18" cy="8" r="2" />
            <path d="M6 8v8M18 10c0 4-6 3-6 8" />
          </svg>
          <span>変更</span>
          <span id="git-toggle-count" class="badge" hidden></span>
        </button>
      </div>
      <section id="diff-view" class="diff" hidden aria-labelledby="diff-title">
        <div class="diff__head">
          <span id="diff-title" class="diff__title"></span>
          <span id="diff-kind" class="work__tag"></span>
          <button id="diff-close" class="icon-btn" type="button" aria-label="差分を閉じる" title="閉じる（Esc）">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>
        <div id="diff-body" class="diff__body"></div>
      </section>
      <div id="empty" class="empty" hidden>
        <p>開いているターミナルはありません</p>
        <button id="empty-new" class="btn btn--primary" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          <span>新しいターミナル</span>
        </button>
      </div>
    </main>

    <aside id="git-panel" class="panel" aria-label="変更" hidden>
      <div class="panel__head">
        <span class="panel__title">変更</span>
        <button id="git-refresh" class="icon-btn" type="button" aria-label="読み直す" title="読み直す">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5" /></svg>
        </button>
        <button id="git-close" class="icon-btn" type="button" aria-label="変更の一覧を閉じる" title="閉じる（⌘⇧G）">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <p id="git-empty" class="panel__empty" hidden></p>
      <div id="git-content" class="panel__content" hidden>
        <div class="git__branch">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="6" cy="6" r="2" /><circle cx="6" cy="18" r="2" /><circle cx="18" cy="8" r="2" />
            <path d="M6 8v8M18 10c0 4-6 3-6 8" />
          </svg>
          <span id="git-branch" class="git__branch-name"></span>
          <span id="git-ab" class="git__ab"></span>
        </div>
        <div class="git__sync">
          <button id="git-fetch" class="btn" type="button">フェッチ</button>
          <button id="git-pull" class="btn" type="button">プル</button>
          <button id="git-push" class="btn" type="button">プッシュ</button>
        </div>
        <p id="git-upstream" class="git__note"></p>
        <div class="git__lists">
          <p id="git-clean" class="panel__empty" hidden>変更はありません</p>
          <section class="git__group" data-group="conflicted" hidden>
            <div class="git__group-head"><span>競合</span><span class="git__count"></span></div>
            <ul class="git__files"></ul>
          </section>
          <section class="git__group" data-group="staged">
            <div class="git__group-head">
              <span>ステージ済み</span><span class="git__count"></span>
              <button class="btn btn--xs" type="button" data-action="unstage-all">すべて外す</button>
            </div>
            <ul class="git__files"></ul>
          </section>
          <section class="git__group" data-group="unstaged">
            <div class="git__group-head">
              <span>未ステージ</span><span class="git__count"></span>
              <button class="btn btn--xs" type="button" data-action="stage-all">すべてステージ</button>
            </div>
            <ul class="git__files"></ul>
          </section>
        </div>
        <form id="git-commit" class="git__commit">
          <p id="git-identity" class="git__note"></p>
          <textarea name="message" class="input git__message" rows="3" placeholder="コミットメッセージ" spellcheck="false"></textarea>
          <p id="git-commit-reason" class="git__note" hidden></p>
          <button type="submit" class="btn btn--primary btn--block-sm">コミット<kbd class="btn__key">⌘↩</kbd></button>
        </form>
        <p id="git-result" class="git__result" role="status" hidden></p>
      </div>
    </aside>

    <dialog id="work-dialog" class="dialog" aria-labelledby="work-dialog-title">
      <form method="dialog" class="dialog__body">
        <h2 id="work-dialog-title" class="dialog__title">新しい作業</h2>
        <label class="field">
          <span class="field__label">リポジトリ</span>
          <select name="repo" class="input" required></select>
        </label>
        <label class="field">
          <span class="field__label">ブランチ名</span>
          <input name="branch" class="input" required autocomplete="off" spellcheck="false" placeholder="feature/add-login" />
        </label>
        <label class="field">
          <span class="field__label">元にするブランチ</span>
          <input name="base" class="input" required autocomplete="off" spellcheck="false" />
        </label>
        <label class="field">
          <span class="field__label">作ったら起動する</span>
          <select name="command" class="input">
            <option value="claude">claude</option>
            <option value="codex">codex</option>
            <option value="">起動しない</option>
          </select>
        </label>
        <p class="dialog__error" role="alert" hidden></p>
        <div class="dialog__actions">
          <button type="button" class="btn" data-action="cancel">キャンセル</button>
          <button type="submit" class="btn btn--primary" data-action="submit">作成</button>
        </div>
      </form>
    </dialog>

    <dialog id="remove-dialog" class="dialog" aria-labelledby="remove-dialog-title">
      <form method="dialog" class="dialog__body">
        <h2 id="remove-dialog-title" class="dialog__title">作業を削除</h2>
        <dl class="dialog__facts">
          <dt>ブランチ</dt>
          <dd data-field="branch"></dd>
          <dt>場所</dt>
          <dd data-field="path"></dd>
        </dl>
        <p class="dialog__note" data-field="note"></p>
        <p class="dialog__error" role="alert" hidden></p>
        <div class="dialog__actions">
          <button type="button" class="btn" data-action="cancel">キャンセル</button>
          <button type="submit" class="btn btn--danger" data-action="submit">削除</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="app.js"></script>
  </body>
</html>
